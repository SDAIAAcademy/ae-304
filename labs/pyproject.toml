[project]
name = "ae-304-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course AE-304 Retrieval and Knowledge Engineering for Language Model Systems"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "duckdb>=1.2",
    "networkx>=3.4",
    "sqlglot>=26.0",
    "faiss-cpu>=1.9",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[tool.uv]
package = false
