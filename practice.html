<section>
<h2>Day 1: Measure and search</h2>
<ol>
<li><p>Nibras's search scores nDCG@10 0.47 overall. A colleague proposes a new embedding model that scores 0.49 on the same 60 queries, judged only on pages the old system found. What do you do first?</p><ul><li><b>A.</b> Adopt it: 0.49 is higher than 0.47</li><li><b>B.</b> Add the new model's top results to the pool, judge them, then compare by language</li><li><b>C.</b> Judge the model's answers instead of its rankings</li><li><b>D.</b> Double the test set to 120 queries and rerun</li></ul></li>
<li><p>Kawthar adds a normaliser to the indexing pipeline and rebuilds the index. Arabic recall at 10 stays at 0.34. English is unchanged too. What is the most likely cause?</p><ul><li><b>A.</b> BM25 cannot rank Arabic text</li><li><b>B.</b> The Arabic queries are all in dialect</li><li><b>C.</b> Normalisation needs a deep root stemmer to work</li><li><b>D.</b> The queries are not passed through the same normaliser</li></ul></li>
<li><p>On test set v1, normalised BM25 scores nDCG@10 0.543 on Arabic and dense e5 scores 0.375. On English, e5 scores 0.639 and BM25 0.532. What should Kawthar conclude?</p><ul><li><b>A.</b> Each method wins on one language, so a combination is worth measuring</li><li><b>B.</b> Dense retrieval does not work for Arabic and should be dropped</li><li><b>C.</b> A larger embedding model will beat BM25 on both languages</li><li><b>D.</b> The two are equal, since their averages are close</li></ul></li>
<li><p>Retrieval for Nibras must answer within 400 ms at the 95th percentile. Reranking the top 30 raises nDCG@10 from 0.570 to 0.633 and takes 11 s at p95 on the current servers, which have no GPU. What do you recommend?</p><ul><li><b>A.</b> Ship it: quality matters more than speed</li><li><b>B.</b> Ship it with a rerank depth of 5</li><li><b>C.</b> Ship hybrid RRF now and measure the reranker on a GPU before deciding</li><li><b>D.</b> Ship BM25 alone, since reranking is too slow</li></ul></li>
<li><p>A new dense model is scored on test set v1, whose judgements were pooled from BM25 only. It finds many pages BM25 never returned. What does its nDCG@10 most likely show?</p><ul><li><b>A.</b> A fair score, since the queries are the same for both systems</li><li><b>B.</b> A score that is too low, since its new pages are unjudged and count as not relevant</li><li><b>C.</b> A score that is too high, since dense models match more words</li><li><b>D.</b> No score at all, since nDCG needs judgements for every page</li></ul></li>
<li><p>Nibras's generator reads only the first page it retrieves. Which metric tells Kawthar most directly how often that page is relevant?</p><ul><li><b>A.</b> Recall at 10</li><li><b>B.</b> nDCG at 10</li><li><b>C.</b> Reciprocal rank</li><li><b>D.</b> The number of judged pairs</li></ul></li>
<li><p>A change raises nDCG@10 on all 60 queries from 0.473 to 0.480. What should the report show before anyone calls it an improvement?</p><ul><li><b>A.</b> The same metric for Arabic, English and each query type, before and after</li><li><b>B.</b> The change in recall at 100</li><li><b>C.</b> The latency of the old system</li><li><b>D.</b> A screenshot of three good answers</li></ul></li>
<li><p>Kawthar adds five new dialect queries to the test set after the baseline was scored. How should she record them?</p><ul><li><b>A.</b> Add them to v1 and rescore every earlier run</li><li><b>B.</b> Keep them in a notebook cell only</li><li><b>C.</b> Replace five old queries so the count stays at 60</li><li><b>D.</b> Save them as v1.1 and keep v1 frozen, so earlier numbers stay comparable</li></ul></li>
<li><p>After Arabic normalisation is added to indexing, the query "الأولى" still finds nothing that the page spelled "الاولى" holds. What is wrong?</p><ul><li><b>A.</b> BM25 does not support Arabic</li><li><b>B.</b> The query was not passed through the same normaliser as the pages</li><li><b>C.</b> The index needs a deep root stemmer</li><li><b>D.</b> The page is too long for BM25</li></ul></li>
<li><p>BM25 scores on the corpus run from 0.3 to 28 and cosine scores from 0.78 to 0.93. Why does reciprocal rank fusion handle this better than adding the scores?</p><ul><li><b>A.</b> It multiplies the two scores, which cancels the scales</li><li><b>B.</b> It uses only the dense ranking when the scores disagree</li><li><b>C.</b> It uses ranks, so the scale of each score does not matter</li><li><b>D.</b> It normalises each score to between 0 and 1 first</li></ul></li>
<li><p>Reranking the top 30 raises nDCG@10 from 0.570 to 0.633 and adds about 11 s at p95 on servers without a GPU. The retrieval budget is 400 ms. What follows?</p><ul><li><b>A.</b> Ship it, since the gain is large</li><li><b>B.</b> Rerank the top 5, which keeps most of the gain</li><li><b>C.</b> Drop hybrid search and keep BM25</li><li><b>D.</b> Ship fusion without the reranker and measure the reranker on a GPU</li></ul></li>
<li><p>Embedding queries and pages with multilingual-e5-small without its "query:" and "passage:" prefixes raises an error, so the mistake is caught at once.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Prepare the corpus</h2>
<ol>
<li><p>Dense e5 scored nDCG@10 0.375 on Arabic and 0.639 on English; normalised BM25 scored 0.543 and 0.532; their RRF fusion 0.510 and 0.630. Which reading is right?</p><ul><li><b>A.</b> Fusion beats both inputs on both languages</li><li><b>B.</b> Dense retrieval cannot serve Arabic</li><li><b>C.</b> The three methods are equal, since their averages are close</li><li><b>D.</b> Fusion helps English a lot and costs a little on Arabic, so Arabic needs its own look</li></ul></li>
<li><p>Students report that Nibras never finds the 2019 study plans, which the registrar scanned from paper. The plans are in the index. What should Kawthar check first?</p><ul><li><b>A.</b> The weight of the title column in BM25</li><li><b>B.</b> The parsed text of those pages: a scan read by a text-layer parser is empty</li><li><b>C.</b> A better embedding model for Arabic</li><li><b>D.</b> The chunk size of the study plans</li></ul></li>
<li><p>Nibras uses 120-word windows on the study plans and answers 0.25 of the table questions in the top 3. Which change does the evidence support most?</p><ul><li><b>A.</b> Shrink the windows to 60 words for precision</li><li><b>B.</b> Add a reranker on top of the windows</li><li><b>C.</b> Chunk by semester heading and carry the plan and year into each chunk</li><li><b>D.</b> Add a 20-word overlap between windows</li></ul></li>
<li><p>On 1 November 2026 a student asks for the maximum study load. The article says 20 hours. Circular 2026-140, issued in October, sets 18 hours from 1 January 2027. What is the right answer?</p><ul><li><b>A.</b> 18 hours, since the circular is newer</li><li><b>B.</b> Both numbers, and let the student decide</li><li><b>C.</b> Neither, since the rule is changing</li><li><b>D.</b> 20 hours, and that 18 hours applies from 1 January 2027</li></ul></li>
<li><p>Nibras must never show a student a Restricted page and must still return ten useful results. Which design meets both?</p><ul><li><b>A.</b> Label each chunk from its document, default to Restricted, and rank only the chunks the account may see</li><li><b>B.</b> Tell the model in the system prompt not to quote Restricted pages</li><li><b>C.</b> Take the top 10 and remove the Restricted ones</li><li><b>D.</b> Label each page from its own text with a classifier</li></ul></li>
<li><p>A scanned page of the study plan goes through a parser that reads only the PDF text layer. What does the index get?</p><ul><li><b>A.</b> Empty text, so the page can never be retrieved</li><li><b>B.</b> The text with a few letters confused</li><li><b>C.</b> The table with its columns in the wrong order</li><li><b>D.</b> The same text a layout-aware parser would give</li></ul></li>
<li><p>Parser A is fast and good on digital pages without tables; parser B is slower and good everywhere. What is the best use of the scores by page type?</p><ul><li><b>A.</b> Use parser A everywhere, since it is faster</li><li><b>B.</b> Average both outputs for every page</li><li><b>C.</b> Route each page by its type: A where it scores as well as B, B elsewhere</li><li><b>D.</b> Use parser B everywhere, since it is never worse</li></ul></li>
<li><p>Fixed 120-word windows cut a study-plan table in the middle. Which chunking answered the most table questions in Lab 2.2?</p><ul><li><b>A.</b> Fixed windows of 240 words</li><li><b>B.</b> Chunks by heading, each carrying its heading path</li><li><b>C.</b> One chunk per page</li><li><b>D.</b> Fixed windows of 60 words</li></ul></li>
<li><p>Nibras retrieves the top 10 and then removes pages the student may not see. For some queries the student gets 2 results. What fixes it without leaking?</p><ul><li><b>A.</b> Filter by role and classification before ranking, so the top 10 come from allowed pages only</li><li><b>B.</b> Retrieve the top 100 and filter after</li><li><b>C.</b> Show the Restricted titles without their text</li><li><b>D.</b> Ask the model to ignore Restricted pages</li></ul></li>
<li><p>Circular 2026-140 lowers the maximum study load from 20 to 18 hours, effective 1 January 2027. Today is 1 November 2026. What should Nibras answer?</p><ul><li><b>A.</b> 18 hours, since the circular is the newest text</li><li><b>B.</b> Both values, and let the student choose</li><li><b>C.</b> 20 hours, and that 18 hours takes effect on 1 January 2027</li><li><b>D.</b> Nothing, since the rule is changing</li></ul></li>
<li><p>The leak suite passes: no Restricted page reaches the student account in 12 tests. What else must the suite check before the result means anything?</p><ul><li><b>A.</b> That the tests ran in under a second</li><li><b>B.</b> That the student still gets the Public pages that answer the same questions</li><li><b>C.</b> That the registrar account also gets no Restricted pages</li><li><b>D.</b> That the model's answers are polite</li></ul></li>
<li><p>A page retrieved from the university's own corpus can be treated as trusted instructions for the model, since the university wrote it.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Agentic search and knowledge</h2>
<ol>
<li><p>After a re-index, a student asks about the attendance rule and Nibras quotes the regulation's original text, which Circular 2025-118 amended. Which test should have caught it before release?</p><ul><li><b>A.</b> The leak suite from the student account</li><li><b>B.</b> The staleness suite, which fails when the old answer comes first</li><li><b>C.</b> nDCG@10 on test set v1</li><li><b>D.</b> Word error rate on the 30 parsing pages</li></ul></li>
<li><p>A student writes in dialect: "ابي اعرف وش اسوي اذا مرضت يوم الاختبار" (what do I do if I am sick on the exam day). Which first call is best?</p><ul><li><b>A.</b> list_files("regulations")</li><li><b>B.</b> keyword_search with the question as written</li><li><b>C.</b> vector_search with the question as written</li><li><b>D.</b> read_file on every article of the examination chapter</li></ul></li>
<li><p>Question: "How many credit hours is the first prerequisite of CHM 423?" The first search returned the CHM 423 course page, which lists "Prerequisite: CHM 301". What is the best next search?</p><ul><li><b>A.</b> The question again, as written</li><li><b>B.</b> "credit hours prerequisite"</li><li><b>C.</b> No search: answer with the hours on the CHM 423 page</li><li><b>D.</b> "CHM 301 course description credit hours"</li></ul></li>
<li><p>A tool returns 60 course pages (about 8,500 tokens) for "how many Engineering courses carry 4 credit hours?". The result budget is 1,500 tokens. What design answers correctly with the smallest context?</p><ul><li><b>A.</b> Cut the result to 1,500 tokens and count</li><li><b>B.</b> Raise the budget to 10,000 tokens</li><li><b>C.</b> Offload the result to a file, return a stub, and search the file for "Credit hours: 4"</li><li><b>D.</b> Ask the model to summarise the 60 pages first</li></ul></li>
<li><p>Nibras has search tools and a small graph of courses, plans and prerequisites. Which question gains most from the graph?</p><ul><li><b>A.</b> "Must I pass MTH 112 before PHY 401?"</li><li><b>B.</b> "What does the regulation say about appealing a grade?"</li><li><b>C.</b> "How many circulars were issued in 2024?"</li><li><b>D.</b> "What is the description of CSC 301?"</li></ul></li>
<li><p>A student asks Nibras how many circulars the university issued in 2025. Which tool is the cheapest that answers it?</p><ul><li><b>A.</b> Vector search for "circulars of 2025"</li><li><b>B.</b> Keyword search for "2025"</li><li><b>C.</b> Reading every circular in full</li><li><b>D.</b> Listing the files under circulars/2025</li></ul></li>
<li><p>"What GPA do I need to transfer into the college that teaches CLS 334?" One search returns the course page but no transfer rule. What does an iterative loop do next?</p><ul><li><b>A.</b> Search for the college named on the course page together with its transfer rules</li><li><b>B.</b> Answer from the course page</li><li><b>C.</b> Repeat the same search with k = 20</li><li><b>D.</b> Stop, since the first search found the course</li></ul></li>
<li><p>A tool returns all 60 Engineering course pages, about 8,500 tokens, into a 1,500-token budget. What keeps the answer correct and the context small?</p><ul><li><b>A.</b> Cut the result to the first 1,500 tokens</li><li><b>B.</b> Write the result to a file, return a short stub, and give the agent a tool to search the file</li><li><b>C.</b> Raise the budget to 10,000 tokens</li><li><b>D.</b> Summarise the result with the model before the agent reads it</li></ul></li>
<li><p>"Which courses must I pass, directly or indirectly, before PHY 401?" Why does a graph answer this better than search?</p><ul><li><b>A.</b> A graph stores longer texts than an index</li><li><b>B.</b> A graph is faster to build than an index</li><li><b>C.</b> The answer is a chain of prerequisite links, which a graph walks in one query</li><li><b>D.</b> Search cannot read course pages</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Structured data and diagnosis</h2>
<ol>
<li><p>A student asks: "How many courses of the College of Health Sciences carry 4 credit hours?" The tool that lists the college's course pages returns about 8,000 tokens; the result budget is 1,500. What should the agent do?</p><ul><li><b>A.</b> Count in the first 1,500 tokens of the result</li><li><b>B.</b> Get a stub for the offloaded file and search it for the pattern</li><li><b>C.</b> Run vector search for "4 credit hour courses"</li><li><b>D.</b> Ask the prerequisite graph for the college's courses</li></ul></li>
<li><p>"How many students were enrolled in the second semester of 2025/2026?" The model's query counts every student with an enrolment row in the term and returns 4,912. The reference returns 4,780. The query runs without error. What went wrong most likely?</p><ul><li><b>A.</b> A syntax error the database ignored</li><li><b>B.</b> The model could not read the enrolments table</li><li><b>C.</b> A missing filter: withdrawn enrolments were counted as enrolled</li><li><b>D.</b> The model is too small for SQL</li></ul></li>
<li><p>The validator accepts a request for enrolled_students in term 2025-1 for the College of Business. What does that acceptance prove?</p><ul><li><b>A.</b> That the number answers the user's question</li><li><b>B.</b> That the result matches the reference answer</li><li><b>C.</b> That the model chose the right metric for the question</li><li><b>D.</b> That the query reads allowed views with filter values that exist</li></ul></li>
<li><p>Nibras's retrieval p95 by stage: lexical 6 ms, dense 4 ms, fusion under 1 ms, query embedding 82 ms, rerank of the top 30 about 10,900 ms. The budget is 400 ms. What do you change first?</p><ul><li><b>A.</b> The reranker: shrink its depth, move it to a GPU, or drop it, and measure the quality cost</li><li><b>B.</b> The fusion code</li><li><b>C.</b> A faster embedding model</li><li><b>D.</b> Lexical search</li></ul></li>
<li><p>A failure's trace: the needed words are in the parsed text, the answering page is candidate 12 of 50, and the top 5 the model read do not include it. The answer says "I could not find a rule". Which component do you attribute it to?</p><ul><li><b>A.</b> Generation</li><li><b>B.</b> Retrieval</li><li><b>C.</b> Ranking</li><li><b>D.</b> Parsing</li></ul></li>
<li><p>A student's question failed. The page that answers it is not among the 50 candidates, and its parsed text is empty. Which component do you fix first?</p><ul><li><b>A.</b> Retrieval: the page is not among the candidates</li><li><b>B.</b> Ranking: the reranker should have lifted it</li><li><b>C.</b> Generation: the model should have said it did not know</li><li><b>D.</b> Parsing: retrieval cannot find text that was never extracted</li></ul></li>
<li><p>How is a text-to-SQL answer scored by execution accuracy?</p><ul><li><b>A.</b> By comparing the SQL text with the reference SQL</li><li><b>B.</b> By asking a model whether the SQL looks right</li><li><b>C.</b> By checking that the SQL runs without an error</li><li><b>D.</b> By running the SQL and comparing its result with the reference answer</li></ul></li>
<li><p>Free text-to-SQL averaged grade points per course where the reference weights them by credit hours. Which kind of failure is this?</p><ul><li><b>A.</b> A business rule the schema does not state</li><li><b>B.</b> A syntax error</li><li><b>C.</b> A missing table</li><li><b>D.</b> A permission error</li></ul></li>
<li><p>In the semantic layer of Lab 4.2, what does the model produce?</p><ul><li><b>A.</b> A SQL query over the students table</li><li><b>B.</b> A summary of the warehouse</li><li><b>C.</b> A request naming a governed metric, its filters and its dimensions, which code compiles and validates</li><li><b>D.</b> The final number, from its own knowledge</li></ul></li>
<li><p>On 20 questions, free text-to-SQL scored 0.60 with 8 confident wrong numbers; the semantic layer scored 0.95, refused 1 and gave none. What should the memo recommend?</p><ul><li><b>A.</b> Free text-to-SQL, since it answers every question</li><li><b>B.</b> Both, and show the student whichever number is larger</li><li><b>C.</b> Free text-to-SQL with a larger model</li><li><b>D.</b> The semantic layer, and add metrics when users ask what no metric covers</li></ul></li>
</ol>
</section>

languages"},{"key":"D","text":"The two are equal, since their averages are close"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The two rankings fail on different queries. When errors differ, fusing the rankings often beats either one, which is the next session.","misconceptions":["","Reads one language's result as the whole verdict","Assumes a bigger model fixes a difference that could come from the corpus or the queries","Averages away the slices the decision depends on"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-embedding-choice","title":"Which conclusion does the evidence support?"},"level":null,"pool":"checkpoint"},{"id":"check-reranker-decision-q1","type":"single","prompt":"Retrieval for Nibras must answer within 400 ms at the 95th percentile. Reranking the top 30 raises nDCG@10 from 0.570 to 0.633 and takes 11 s at p95 on the current servers, which have no GPU. What do you recommend?","options":[{"key":"A","text":"Ship it: quality matters more than speed"},{"key":"B","text":"Ship it with a rerank depth of 5"},{"key":"C","text":"Ship hybrid RRF now and measure the reranker on a GPU before deciding"},{"key":"D","text":"Ship BM25 alone, since reranking is too slow"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"No rerank depth fits 400 ms on this hardware, and RRF already beats each input. The reranker's gain is real, so it deserves a measurement on the hardware that could serve it.","misconceptions":["Lets the quality gain override a stated latency budget","Assumes depth is the only lever, when even depth 5 takes 1.9 s on this hardware","","Drops fusion's measured gain over BM25 alone along with the reranker"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-reranker-decision","title":"Should Nibras ship the reranker?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Dense e5 scored nDCG@10 0.375 on Arabic and 0.639 on English; normalised BM25 scored 0.543 and 0.532; their RRF fusion 0.510 and 0.630. Which reading is right?","options":[{"key":"A","text":"Fusion beats both inputs on both languages"},{"key":"B","text":"Dense retrieval cannot serve Arabic"},{"key":"C","text":"The three methods are equal, since their averages are close"},{"key":"D","text":"Fusion helps English a lot and costs a little on Arabic, so Arabic needs its own look"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"RRF lifted English from 0.532 to 0.630 but sat between its inputs on Arabic. A slice that moves the other way is a finding, not noise to average away.","misconceptions":["Reads the overall gain as a gain on every slice","Takes one model's Arabic score as the verdict on all dense retrieval","Looks at averages only, which is what the slices exist to prevent",""],"lo":["LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"What does yesterday's results table say?"},"level":null,"pool":"checkpoint"},{"id":"check-parser-choice-q1","type":"single","prompt":"Students report that Nibras never finds the 2019 study plans, which the registrar scanned from paper. The plans are in the index. What should Kawthar check first?","options":[{"key":"A","text":"The weight of the title column in BM25"},{"key":"B","text":"The parsed text of those pages: a scan read by a text-layer parser is empty"},{"key":"C","text":"A better embedding model for Arabic"},{"key":"D","text":"The chunk size of the study plans"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A scanned page has no text layer, so a text-layer parser returns nothing and no search method can find it. In Lab 2.1 parser A's WER on scans was 1.0.","misconceptions":["Tunes search before checking that the index holds any text for these pages","","Assumes a meaning-based model can find a page that has no text at all","Fixes a later stage first; chunk size does not matter when there are no words"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-parser-choice","title":"Where should Kawthar look first?"},"level":null,"pool":"checkpoint"},{"id":"check-chunking-q1","type":"single","prompt":"Nibras uses 120-word windows on the study plans and answers 0.25 of the table questions in the top 3. Which change does the evidence support most?","options":[{"key":"A","text":"Shrink the windows to 60 words for precision"},{"key":"B","text":"Add a reranker on top of the windows"},{"key":"C","text":"Chunk by semester heading and carry the plan and year into each chunk"},{"key":"D","text":"Add a 20-word overlap between windows"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The answer needs the code, the semester and the plan in one chunk. Heading chunks guarantee that and answered 0.65 in Lab 2.2.","misconceptions":["Treats smaller as more precise; 60-word windows answered 0.05","Changes ranking when the needed facts are not together in any chunk","","Fixes a different problem: overlap repeats text but does not keep a table whole"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-chunking","title":"Which change will answer more table questions?"},"level":null,"pool":"checkpoint"},{"id":"check-effective-date-q1","type":"single","prompt":"On 1 November 2026 a student asks for the maximum study load. The article says 20 hours. Circular 2026-140, issued in October, sets 18 hours from 1 January 2027. What is the right answer?","options":[{"key":"A","text":"18 hours, since the circular is newer"},{"key":"B","text":"Both numbers, and let the student decide"},{"key":"C","text":"Neither, since the rule is changing"},{"key":"D","text":"20 hours, and that 18 hours applies from 1 January 2027"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The amendment is not yet in force, so today's interval holds the article's value. Mentioning the coming change is useful, and the validity interval gives the date.","misconceptions":["Confuses the issue date with the effective date","Hands the student a decision the regulation already makes","Treats a scheduled change as uncertainty",""],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-effective-date","title":"What should Nibras answer?"},"level":null,"pool":"checkpoint"},{"id":"check-permissions-q1","type":"single","prompt":"Nibras must never show a student a Restricted page and must still return ten useful results. Which design meets both?","options":[{"key":"A","text":"Label each chunk from its document, default to Restricted, and rank only the chunks the account may see"},{"key":"B","text":"Tell the model in the system prompt not to quote Restricted pages"},{"key":"C","text":"Take the top 10 and remove the Restricted ones"},{"key":"D","text":"Label each page from its own text with a classifier"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Labels from the owner's document, a safe default, and a filter inside the ranking give no leaks and a full top 10, which the leak and utility suites both confirmed.","misconceptions":["","Trusts the model to enforce access it has already been given","Leaks nothing but returns too few results, as the 0 to 8 counts showed","Lets page text decide labels, which missed 7 Restricted pages"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-permissions","title":"Which design keeps students away from staff pages?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"After a re-index, a student asks about the attendance rule and Nibras quotes the regulation's original text, which Circular 2025-118 amended. Which test should have caught it before release?","options":[{"key":"A","text":"The leak suite from the student account"},{"key":"B","text":"The staleness suite, which fails when the old answer comes first"},{"key":"C","text":"nDCG@10 on test set v1"},{"key":"D","text":"Word error rate on the 30 parsing pages"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The text is parsed, allowed and relevant; it is only out of date. Only a test that knows the current answer and the stale one can fail on it.","misconceptions":["Checks access, not versions: the original text is Public","","Scores ranking on graded judgements, which do not encode which version is current","Measures the parser, which read both versions correctly"],"lo":["LO4"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which suite catches the problem?"},"level":null,"pool":"checkpoint"},{"id":"check-tool-choice-q1","type":"single","prompt":"A student writes in dialect: \"ابي اعرف وش اسوي اذا مرضت يوم الاختبار\" (what do I do if I am sick on the exam day). Which first call is best?","options":[{"key":"A","text":"list_files(\"regulations\")"},{"key":"B","text":"keyword_search with the question as written"},{"key":"C","text":"vector_search with the question as written"},{"key":"D","text":"read_file on every article of the examination chapter"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A paraphrase in dialect is what meaning-based search is for. If its top pages miss, the next call can be a keyword search for the term the rule uses.","misconceptions":["Lists names when the question needs the content of a rule","Matches words, and the dialect shares few words with the regulation","","Reads whole files without knowing which one holds the rule"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-tool-choice","title":"Which tool should Nibras call first?"},"level":null,"pool":"checkpoint"},{"id":"check-iterative-q1","type":"single","prompt":"Question: \"How many credit hours is the first prerequisite of CHM 423?\" The first search returned the CHM 423 course page, which lists \"Prerequisite: CHM 301\". What is the best next search?","options":[{"key":"A","text":"The question again, as written"},{"key":"B","text":"\"credit hours prerequisite\""},{"key":"C","text":"No search: answer with the hours on the CHM 423 page"},{"key":"D","text":"\"CHM 301 course description credit hours\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The first hop produced an entity, CHM 301. The next search asks for that entity's page, where its credit hours are.","misconceptions":["Repeats a search, which the loop treats as going round in circles","Searches for the answer's words instead of the entity the next hop needs","Answers from the first page, which gives CHM 423's hours, not CHM 301's",""],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-iterative","title":"What should the decider search next?"},"level":null,"pool":"checkpoint"},{"id":"check-offload-q1","type":"single","prompt":"A tool returns 60 course pages (about 8,500 tokens) for \"how many Engineering courses carry 4 credit hours?\". The result budget is 1,500 tokens. What design answers correctly with the smallest context?","options":[{"key":"A","text":"Cut the result to 1,500 tokens and count"},{"key":"B","text":"Raise the budget to 10,000 tokens"},{"key":"C","text":"Offload the result to a file, return a stub, and search the file for \"Credit hours: 4\""},{"key":"D","text":"Ask the model to summarise the 60 pages first"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The file keeps every page; one search returns exactly the matching lines and their count, for a few hundred tokens.","misconceptions":["Counts in a cut list, which gave 1 instead of 10 in the lab","Pays for every page on every later call instead of fixing the design","","Lets a summary drop the rows a count needs"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-offload","title":"How should the agent handle this result?"},"level":null,"pool":"checkpoint"},{"id":"check-graph-q1","type":"single","prompt":"Nibras has search tools and a small graph of courses, plans and prerequisites. Which question gains most from the graph?","options":[{"key":"A","text":"\"Must I pass MTH 112 before PHY 401?\""},{"key":"B","text":"\"What does the regulation say about appealing a grade?\""},{"key":"C","text":"\"How many circulars were issued in 2024?\""},{"key":"D","text":"\"What is the description of CSC 301?\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The answer is a path through prerequisite links of unknown length. One graph query walks it; search needs one call per link and may stop at the budget.","misconceptions":["","Asks for one passage of text, which search finds directly","Asks for a list of files, which listing answers","Asks for the content of one page found by its code"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-graph","title":"Which question does the graph answer best?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"A student asks: \"How many courses of the College of Health Sciences carry 4 credit hours?\" The tool that lists the college's course pages returns about 8,000 tokens; the result budget is 1,500. What should the agent do?","options":[{"key":"A","text":"Count in the first 1,500 tokens of the result"},{"key":"B","text":"Get a stub for the offloaded file and search it for the pattern"},{"key":"C","text":"Run vector search for \"4 credit hour courses\""},{"key":"D","text":"Ask the prerequisite graph for the college's courses"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The full result stays in a file; a search for \"Credit hours: 4\" returns the matching lines and their count, inside the budget.","misconceptions":["Counts in a cut result, which undercounts without any warning","","Uses meaning search for a count, which returns a top k, not every course","Reaches for the graph, whose edges hold prerequisites, not credit hours"],"lo":["LO5"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Which design fits the question?"},"level":null,"pool":"checkpoint"},{"id":"check-free-sql-q1","type":"single","prompt":"\"How many students were enrolled in the second semester of 2025/2026?\" The model's query counts every student with an enrolment row in the term and returns 4,912. The reference returns 4,780. The query runs without error. What went wrong most likely?","options":[{"key":"A","text":"A syntax error the database ignored"},{"key":"B","text":"The model could not read the enrolments table"},{"key":"C","text":"A missing filter: withdrawn enrolments were counted as enrolled"},{"key":"D","text":"The model is too small for SQL"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The count is higher than the reference by students whose only enrolments were withdrawn: a business rule that lives in the institution, not in the schema.","misconceptions":["Expects a wrong query to fail loudly; this one ran","Blames access when the query read the right table","","Assumes a model fault when the rule is simply not in the schema"],"lo":["LO6"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-free-sql","title":"What kind of failure is this?"},"level":null,"pool":"checkpoint"},{"id":"check-semantic-layer-q1","type":"single","prompt":"The validator accepts a request for enrolled_students in term 2025-1 for the College of Business. What does that acceptance prove?","options":[{"key":"A","text":"That the number answers the user's question"},{"key":"B","text":"That the result matches the reference answer"},{"key":"C","text":"That the model chose the right metric for the question"},{"key":"D","text":"That the query reads allowed views with filter values that exist"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Validation proves the query is allowed and well formed. Whether \"enrolled students\" is what the user meant is the metric definition's job, and the test set's.","misconceptions":["Confuses a well-formed query with a correct meaning","Thinks validation checks the result against a reference, which it cannot","Assumes acceptance covers the model's choice of metric",""],"lo":["LO6"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-semantic-layer","title":"Does a valid request mean a right answer?"},"level":null,"pool":"checkpoint"},{"id":"check-latency-q1","type":"single","prompt":"Nibras's retrieval p95 by stage: lexical 6 ms, dense 4 ms, fusion under 1 ms, query embedding 82 ms, rerank of the top 30 about 10,900 ms. The budget is 400 ms. What do you change first?","options":[{"key":"A","text":"The reranker: shrink its depth, move it to a GPU, or drop it, and measure the quality cost"},{"key":"B","text":"The fusion code"},{"key":"C","text":"A faster embedding model"},{"key":"D","text":"Lexical search"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The tail is the reranker; every other stage together is under 100 ms. Day 1's rerank-depth table says what each option costs in nDCG.","misconceptions":["","Optimises a stage that is already a fraction of a millisecond","Saves 82 ms of a total near 11,000 ms","Removes the cheapest stage and its quality, not the tail"],"lo":["LO2"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-latency","title":"Where do you cut first?"},"level":null,"pool":"checkpoint"},{"id":"check-attribution-q1","type":"single","prompt":"A failure's trace: the needed words are in the parsed text, the answering page is candidate 12 of 50, and the top 5 the model read do not include it. The answer says \"I could not find a rule\". Which component do you attribute it to?","options":[{"key":"A","text":"Generation"},{"key":"B","text":"Retrieval"},{"key":"C","text":"Ranking"},{"key":"D","text":"Parsing"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The page reached the candidates but not the top 5: the first component that lost it is ranking. A reranker or hybrid fusion is the fix to try.","misconceptions":["Stops at the last step, which only reported what it was given","The page was among the candidates, so retrieval did its part","","The words were in the parsed text, so parsing did its part"],"lo":["LO3"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-attribution","title":"Which component lost this answer?"},"level":null,"pool":"checkpoint"},{"id":"re-lo1-pool-bias","type":"single","prompt":"A new dense model is scored on test set v1, whose judgements were pooled from BM25 only. It finds many pages BM25 never returned. What does its nDCG@10 most likely show?","options":[{"key":"A","text":"A fair score, since the queries are the same for both systems"},{"key":"B","text":"A score that is too low, since its new pages are unjudged and count as not relevant"},{"key":"C","text":"A score that is too high, since dense models match more words"},{"key":"D","text":"No score at all, since nDCG needs judgements for every page"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Unjudged pages count as grade 0, so a system that finds pages outside the pool is penalised for them until they are judged.","misconceptions":["Thinks shared queries make the comparison fair, ignoring which pages were judged","","Confuses dense retrieval with word matching","Believes every page of the corpus must be judged before any metric is computed"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"re-lo1-which-metric","type":"single","prompt":"Nibras's generator reads only the first page it retrieves. Which metric tells Kawthar most directly how often that page is relevant?","options":[{"key":"A","text":"Recall at 10"},{"key":"B","text":"nDCG at 10"},{"key":"C","text":"Reciprocal rank"},{"key":"D","text":"The number of judged pairs"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Reciprocal rank depends only on the position of the first relevant page, and it is 1 exactly when that page comes first.","misconceptions":["Counts relevant pages anywhere in the top 10, not at the top","Rewards grades and ranks over ten positions, so a good rank 2 hides a bad rank 1","","Confuses the size of the test set with a quality measure"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"re-lo1-slices","type":"single","prompt":"A change raises nDCG@10 on all 60 queries from 0.473 to 0.480. What should the report show before anyone calls it an improvement?","options":[{"key":"A","text":"The same metric for Arabic, English and each query type, before and after"},{"key":"B","text":"The change in recall at 100"},{"key":"C","text":"The latency of the old system"},{"key":"D","text":"A screenshot of three good answers"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A small overall gain can hide a loss on one language or on dialect queries, so the slices decide.","misconceptions":["","Moves to another cut-off without looking at who gained and who lost","Answers a quality question with a speed number","Takes anecdotes as evidence over a measured test set"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"re-lo1-version","type":"single","prompt":"Kawthar adds five new dialect queries to the test set after the baseline was scored. How should she record them?","options":[{"key":"A","text":"Add them to v1 and rescore every earlier run"},{"key":"B","text":"Keep them in a notebook cell only"},{"key":"C","text":"Replace five old queries so the count stays at 60"},{"key":"D","text":"Save them as v1.1 and keep v1 frozen, so earlier numbers stay comparable"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A frozen version keeps every earlier score meaningful; a new version carries the new queries and its own scores.","misconceptions":["Changes the ruler under numbers already reported","Leaves the queries outside the versioned record","Thinks the count matters more than which queries were scored",""],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"re-lo2-normalise-query","type":"single","prompt":"After Arabic normalisation is added to indexing, the query \"الأولى\" still finds nothing that the page spelled \"الاولى\" holds. What is wrong?","options":[{"key":"A","text":"BM25 does not support Arabic"},{"key":"B","text":"The query was not passed through the same normaliser as the pages"},{"key":"C","text":"The index needs a deep root stemmer"},{"key":"D","text":"The page is too long for BM25"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The index holds analysed words, so a raw query asks for keys that are no longer there; both sides need the same analyser.","misconceptions":["Blames the ranking function for a mismatch of text","","Thinks spelling variants need morphology rather than normalisation","Confuses length normalisation with matching"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"re-lo2-rrf-why","type":"single","prompt":"BM25 scores on the corpus run from 0.3 to 28 and cosine scores from 0.78 to 0.93. Why does reciprocal rank fusion handle this better than adding the scores?","options":[{"key":"A","text":"It multiplies the two scores, which cancels the scales"},{"key":"B","text":"It uses only the dense ranking when the scores disagree"},{"key":"C","text":"It uses ranks, so the scale of each score does not matter"},{"key":"D","text":"It normalises each score to between 0 and 1 first"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"RRF adds 1/(k + rank) from each list, so only positions count and no weight has to be tuned to the scales.","misconceptions":["Invents an operation RRF does not perform","Thinks fusion picks one list rather than combining both","","Describes weighted score fusion, which adds a weight to tune"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"re-lo2-rerank-budget","type":"single","prompt":"Reranking the top 30 raises nDCG@10 from 0.570 to 0.633 and adds about 11 s at p95 on servers without a GPU. The retrieval budget is 400 ms. What follows?","options":[{"key":"A","text":"Ship it, since the gain is large"},{"key":"B","text":"Rerank the top 5, which keeps most of the gain"},{"key":"C","text":"Drop hybrid search and keep BM25"},{"key":"D","text":"Ship fusion without the reranker and measure the reranker on a GPU"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"No rerank depth fits 400 ms on that hardware, so the reranker waits for a measurement on hardware that could serve it.","misconceptions":["Lets a quality gain override a stated latency budget","Forgets that even depth 5 took 1.9 s on that hardware","Throws away fusion's measured gain along with the reranker",""],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"re-lo2-prefix","type":"tf","prompt":"Embedding queries and pages with multilingual-e5-small without its \"query:\" and \"passage:\" prefixes raises an error, so the mistake is caught at once.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Nothing fails: the model returns vectors either way, and the mistake only shows as a lower score (0.484 against 0.507 nDCG@10 in Lab 1.3).","misconceptions":["Expects a model to reject inputs that break its card's conventions",""],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"re-lo3-scan","type":"single","prompt":"A scanned page of the study plan goes through a parser that reads only the PDF text layer. What does the index get?","options":[{"key":"A","text":"Empty text, so the page can never be retrieved"},{"key":"B","text":"The text with a few letters confused"},{"key":"C","text":"The table with its columns in the wrong order"},{"key":"D","text":"The same text a layout-aware parser would give"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A scan has no text layer, so a text-layer parser returns nothing; in Lab 2.1 its word error rate on scans was 1.0.","misconceptions":["","Describes character recognition errors, which need a recognition step to happen at all","Describes a table problem of digital pages","Assumes every parser sees the same content"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"re-lo3-route","type":"single","prompt":"Parser A is fast and good on digital pages without tables; parser B is slower and good everywhere. What is the best use of the scores by page type?","options":[{"key":"A","text":"Use parser A everywhere, since it is faster"},{"key":"B","text":"Average both outputs for every page"},{"key":"C","text":"Route each page by its type: A where it scores as well as B, B elsewhere"},{"key":"D","text":"Use parser B everywhere, since it is never worse"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Scores by page type show where the cheap parser is good enough; routing keeps its speed there and B's quality elsewhere.","misconceptions":["Ignores the page types where A fails completely","Thinks mixing two texts repairs either","","Pays B's cost on pages where A is as good"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"re-lo3-heading-path","type":"single","prompt":"Fixed 120-word windows cut a study-plan table in the middle. Which chunking answered the most table questions in Lab 2.2?","options":[{"key":"A","text":"Fixed windows of 240 words"},{"key":"B","text":"Chunks by heading, each carrying its heading path"},{"key":"C","text":"One chunk per page"},{"key":"D","text":"Fixed windows of 60 words"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Heading chunks keep a semester's table whole and name the programme and year in the chunk: 0.65 answerable in the top 3 against 0.25 for 120-word windows.","misconceptions":["Thinks bigger windows fix a cut that is about structure; 240 words reached 0.5","","Puts several semesters in one chunk and loses the precision of ranking","Thinks smaller is more precise, when 60-word windows answered 0.05"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"re-lo3-attribute","type":"single","prompt":"A student's question failed. The page that answers it is not among the 50 candidates, and its parsed text is empty. Which component do you fix first?","options":[{"key":"A","text":"Retrieval: the page is not among the candidates"},{"key":"B","text":"Ranking: the reranker should have lifted it"},{"key":"C","text":"Generation: the model should have said it did not know"},{"key":"D","text":"Parsing: retrieval cannot find text that was never extracted"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Attribute to the first component that lost the answer; here parsing lost it before retrieval ever ran.","misconceptions":["Stops at the symptom instead of walking the pipeline from its start","Blames a stage that never saw the page","Fixes the last stage for a failure that began at the first",""],"lo":["LO3"],"day":4,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"re-lo4-prefilter","type":"single","prompt":"Nibras retrieves the top 10 and then removes pages the student may not see. For some queries the student gets 2 results. What fixes it without leaking?","options":[{"key":"A","text":"Filter by role and classification before ranking, so the top 10 come from allowed pages only"},{"key":"B","text":"Retrieve the top 100 and filter after"},{"key":"C","text":"Show the Restricted titles without their text"},{"key":"D","text":"Ask the model to ignore Restricted pages"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A pre-filter ranks only allowed pages, so the student always gets a full top 10 and never a Restricted one.","misconceptions":["","Shrinks the problem without removing it, and a large top k costs latency","Thinks a title is not a leak","Trusts an instruction to the model to enforce access"],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"re-lo4-validity","type":"single","prompt":"Circular 2026-140 lowers the maximum study load from 20 to 18 hours, effective 1 January 2027. Today is 1 November 2026. What should Nibras answer?","options":[{"key":"A","text":"18 hours, since the circular is the newest text"},{"key":"B","text":"Both values, and let the student choose"},{"key":"C","text":"20 hours, and that 18 hours takes effect on 1 January 2027"},{"key":"D","text":"Nothing, since the rule is changing"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each version has a validity interval; the amendment is not yet in force, so the current value answers today and the change is worth stating.","misconceptions":["Confuses the issue date with the effective date","Hands the student a decision the regulation already made","","Treats a scheduled change as an unknown"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"re-lo4-leak-suite","type":"single","prompt":"The leak suite passes: no Restricted page reaches the student account in 12 tests. What else must the suite check before the result means anything?","options":[{"key":"A","text":"That the tests ran in under a second"},{"key":"B","text":"That the student still gets the Public pages that answer the same questions"},{"key":"C","text":"That the registrar account also gets no Restricted pages"},{"key":"D","text":"That the model's answers are polite"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Returning nothing also passes a leak test; a utility check shows the filter blocks only what it should.","misconceptions":["Measures speed where the question is correctness","","Over-blocks the role that is allowed to see those pages","Moves to answer style, which the access tests do not cover"],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"re-lo4-untrusted","type":"tf","prompt":"A page retrieved from the university's own corpus can be treated as trusted instructions for the model, since the university wrote it.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Retrieved text is data: a page can carry text written to steer the model, so it is quoted, never obeyed.","misconceptions":["Takes the source of a corpus as a guarantee about every line in it",""],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"re-lo5-tool-choice","type":"single","prompt":"A student asks Nibras how many circulars the university issued in 2025. Which tool is the cheapest that answers it?","options":[{"key":"A","text":"Vector search for \"circulars of 2025\""},{"key":"B","text":"Keyword search for \"2025\""},{"key":"C","text":"Reading every circular in full"},{"key":"D","text":"Listing the files under circulars/2025"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is about what exists, so file names answer it without any page text.","misconceptions":["Searches by meaning for a count, which returns a top k, not all of them","Returns pages that mention the year, not one entry per circular","Pays for full texts where names suffice",""],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"re-lo5-two-hop","type":"single","prompt":"\"What GPA do I need to transfer into the college that teaches CLS 334?\" One search returns the course page but no transfer rule. What does an iterative loop do next?","options":[{"key":"A","text":"Search for the college named on the course page together with its transfer rules"},{"key":"B","text":"Answer from the course page"},{"key":"C","text":"Repeat the same search with k = 20"},{"key":"D","text":"Stop, since the first search found the course"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The first hop gives the college; the second searches for that college's rule. In Lab 3.2 iterative search answered 0.9 of the ten questions against 0.7 for one search.","misconceptions":["","Answers a two-step question from one step","Thinks a bigger k replaces a better query","Takes a found entity for a found answer"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"re-lo5-offload","type":"single","prompt":"A tool returns all 60 Engineering course pages, about 8,500 tokens, into a 1,500-token budget. What keeps the answer correct and the context small?","options":[{"key":"A","text":"Cut the result to the first 1,500 tokens"},{"key":"B","text":"Write the result to a file, return a short stub, and give the agent a tool to search the file"},{"key":"C","text":"Raise the budget to 10,000 tokens"},{"key":"D","text":"Summarise the result with the model before the agent reads it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Offloading keeps every page one tool call away; in Lab 3.3 accuracy rose from 0.5 to 1.0 and tokens fell from about 1,724 to 924.","misconceptions":["Counts in a truncated list and gets a wrong number","","Pays for every page on every step instead of fixing the design","Lets a summary drop the rows the count needs"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"re-lo5-graph","type":"single","prompt":"\"Which courses must I pass, directly or indirectly, before PHY 401?\" Why does a graph answer this better than search?","options":[{"key":"A","text":"A graph stores longer texts than an index"},{"key":"B","text":"A graph is faster to build than an index"},{"key":"C","text":"The answer is a chain of prerequisite links, which a graph walks in one query"},{"key":"D","text":"Search cannot read course pages"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Following prerequisites with search costs a search per link and stops at the budget; a graph walk returns the whole chain at once.","misconceptions":["Confuses a store of relationships with a store of text","Answers a quality question with build time","","Overstates the failure: search finds each page, it just needs many searches"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"re-lo6-execution-accuracy","type":"single","prompt":"How is a text-to-SQL answer scored by execution accuracy?","options":[{"key":"A","text":"By comparing the SQL text with the reference SQL"},{"key":"B","text":"By asking a model whether the SQL looks right"},{"key":"C","text":"By checking that the SQL runs without an error"},{"key":"D","text":"By running the SQL and comparing its result with the reference answer"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Two different queries can be right and one query that runs can be wrong, so the result is what counts.","misconceptions":["Penalises correct queries written differently","Replaces a measurement with an opinion","Counts a query that runs and returns the wrong number as right",""],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"re-lo6-confident-wrong","type":"single","prompt":"Free text-to-SQL averaged grade points per course where the reference weights them by credit hours. Which kind of failure is this?","options":[{"key":"A","text":"A business rule the schema does not state"},{"key":"B","text":"A syntax error"},{"key":"C","text":"A missing table"},{"key":"D","text":"A permission error"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The query runs and returns a plausible number; only the definition of the metric says it is wrong, which is why it is a confident wrong answer.","misconceptions":["","Expects a wrong query to fail loudly","Thinks the model lacked data rather than a definition","Mistakes a wrong number for an access problem"],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"re-lo6-semantic-layer","type":"single","prompt":"In the semantic layer of Lab 4.2, what does the model produce?","options":[{"key":"A","text":"A SQL query over the students table"},{"key":"B","text":"A summary of the warehouse"},{"key":"C","text":"A request naming a governed metric, its filters and its dimensions, which code compiles and validates"},{"key":"D","text":"The final number, from its own knowledge"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The definitions live in reviewed views and a catalog; the model only chooses among them, and code builds the SQL.","misconceptions":["Describes free text-to-SQL, the approach the layer replaces","Thinks the model reads the data rather than the definitions","","Lets the model invent the number"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"re-lo6-decision","type":"single","prompt":"On 20 questions, free text-to-SQL scored 0.60 with 8 confident wrong numbers; the semantic layer scored 0.95, refused 1 and gave none. What should the memo recommend?","options":[{"key":"A","text":"Free text-to-SQL, since it answers every question"},{"key":"B","text":"Both, and show the student whichever number is larger"},{"key":"C","text":"Free text-to-SQL with a larger model"},{"key":"D","text":"The semantic layer, and add metrics when users ask what no metric covers"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A refusal can be handled; a confident wrong statistic misleads, and the gap in coverage is closed by adding reviewed metrics.","misconceptions":["Counts answering as success whatever the answer","Hands the student a choice between two numbers","Assumes a bigger model knows the university's business rules",""],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"evaluate","pool":"practice"}]}</script>
